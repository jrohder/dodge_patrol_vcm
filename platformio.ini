; Dodge Patrol VCM - ESP32-S3 Vehicle Control Module
;
; Environments:
;   esp32s3  - production firmware (ESP32-S3, Arduino core on ESP-IDF, dual OTA slots)
;   native   - host-side unit tests for pure control/math logic
;
; Build:  pio run -e esp32s3
; Flash:  pio run -e esp32s3 -t upload
; Tests:  pio test -e native

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
board_build.flash_size = 8MB
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
extra_scripts =
    pre:tools/version.py
    pre:tools/embed_web.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
    esp32async/AsyncTCP @ ^3.3.2
    esp32async/ESPAsyncWebServer @ ^3.6.0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<control/pid.cpp>
    +<control/vehicle_model.cpp>
    +<control/speed_calculator.cpp>
    +<control/differential_steering.cpp>
    +<proto/protocol.cpp>
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -Isrc
