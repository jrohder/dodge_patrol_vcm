name: Build

on:
  push:
    branches: ["main", "cursor/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run native unit tests
        run: pio test -e native

  build:
    name: Build firmware (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so git describe produces the version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e esp32s3
      - name: Name artifacts
        id: name
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp .pio/build/esp32s3/firmware.bin "dodge_patrol_vcm-${VERSION}.bin"
          # Merged image for the initial USB flash (bootloader+partitions+app),
          # using the esptool bundled with the PlatformIO toolchain
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
            -o "dodge_patrol_vcm-${VERSION}-factory.bin" \
            0x0000 .pio/build/esp32s3/bootloader.bin \
            0x8000 .pio/build/esp32s3/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/esp32s3/firmware.bin
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.name.outputs.version }}
          path: dodge_patrol_vcm-*.bin

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dodge_patrol_vcm-*.bin
          generate_release_notes: true
          body: |
            ESP32-S3 Vehicle Control Module firmware.

            **Assets**
            - `dodge_patrol_vcm-<version>.bin` — OTA image (upload via the web UI, or let the vehicle install it from this release)
            - `dodge_patrol_vcm-<version>-factory.bin` — merged image for the initial USB flash at offset `0x0`
